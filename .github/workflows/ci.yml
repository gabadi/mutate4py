name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both supported platforms (ADR 0019, README "Supported platforms").
        # No Windows: the forking execution path requires os.fork.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          version: "0.12.3"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      # Gate commands live in the justfile (one source of truth for CI + local
      # `just check`) — see justfile's header comment. Steps stay separate
      # (rather than one `just check` call) so the Actions UI keeps per-gate
      # timing and log folding.
      - name: Lint
        run: just lint
      - name: Format check
        run: just format-check
      - name: Tests
        run: just test
      - name: Install lcov
        # apt on Linux, Homebrew (preinstalled on the macOS runner image) on macOS.
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get install -y lcov
          else
            brew install lcov
          fi
        if: always()
      - name: Coverage report
        uses: zgosalvez/github-actions-report-lcov@84f16a83ae03e846a4c697bd75cae3f94fa9f426 # v7.0.12
        # One leg only: this posts/updates a PR comment, and running it twice
        # (once per OS) would duplicate or race that comment for no benefit —
        # both legs produce the same lcov.info from the same test suite.
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          coverage-files: lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: CRAP
        run: just crap
      - name: Install drywall
        # Pinned to drywall's latest release; bump this tag alongside the SHA
        # pins on the GitHub Actions above when drywall cuts a new release.
        # macos-latest runners are arm64, hence the aarch64 asset.
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            asset=drywall-linux-x86_64
          else
            asset=drywall-macos-aarch64
          fi
          gh release download v0.1.3 --repo gabadi/drywall --pattern "$asset" --output drywall
          chmod +x drywall
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: DRY
        run: just dry
        env:
          DRYWALL: ./drywall
      - name: Mutation manifest
        run: just manifest
      - name: Install gherkin-parser
        # Pinned to a specific commit SHA, not a "stable release": upstream
        # has no tags (confirmed via `git ls-remote --tags
        # https://github.com/unclebob/Acceptance-Pipeline-Specification`
        # returning nothing), so there is no release tag to pin instead.
        # This pin governs only CI's build of gherkin-parser here — it does
        # not and cannot pin any separately, manually installed local
        # gherkin-parser binary (e.g. a developer's ~/.local/bin/gherkin-parser),
        # which has no manifest in this repo and stays an unmanaged,
        # out-of-scope concern.
        # Built into RUNNER_TEMP (guaranteed writable on every runner, unlike
        # /usr/local/bin which needs sudo on the macOS runner image) and
        # added to PATH via GITHUB_PATH — works identically on both OSes.
        run: |
          git clone https://github.com/unclebob/Acceptance-Pipeline-Specification /tmp/aps
          cd /tmp/aps && git checkout accaa33d503340c56513ef387258f8da929ba902
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/gherkin-parser" ./cmd/gherkin-parser
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Acceptance tests
        run: just acceptance
