name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # Gate commands live in the justfile (one source of truth for CI + local
      # `just check`) — see justfile's header comment. Steps stay separate
      # (rather than one `just check` call) so the Actions UI keeps per-gate
      # timing and log folding.
      - name: Lint
        run: just lint
      - name: Format check
        run: just format-check
      - name: Tests
        run: just test
      - name: Install lcov
        run: sudo apt-get install -y lcov
        if: always()
      - name: Coverage report
        uses: zgosalvez/github-actions-report-lcov@84f16a83ae03e846a4c697bd75cae3f94fa9f426 # v7.0.12
        if: always()
        with:
          coverage-files: lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: CRAP
        run: just crap
      - name: Install drywall
        run: |
          gh release download --repo gabadi/drywall --pattern 'drywall-linux-x86_64' --output drywall
          chmod +x drywall
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: DRY
        run: just dry
        env:
          DRYWALL: ./drywall
      - name: Mutation manifest
        run: just manifest
      - name: Install gherkin-parser
        run: |
          git clone --depth 1 https://github.com/unclebob/Acceptance-Pipeline-Specification /tmp/aps
          cd /tmp/aps && go build -o /usr/local/bin/gherkin-parser ./cmd/gherkin-parser
      - name: Acceptance tests
        run: just acceptance
