name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          version: "0.12.3"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      # Gate commands live in the justfile (one source of truth for CI + local
      # `just check`) — see justfile's header comment. Steps stay separate
      # (rather than one `just check` call) so the Actions UI keeps per-gate
      # timing and log folding.
      - name: Lint
        run: just lint
      - name: Format check
        run: just format-check
      # Three steps, one job, one coverage measurement: test-component and
      # test-integration each append to the previous step's data, and only
      # test-integration applies the threshold. They cannot be moved to
      # separate jobs without merging coverage first — the `crap` gate below
      # reads lcov.info and needs all three. See the justfile.
      - name: Tests (unit)
        run: just test-unit
      - name: Tests (component)
        run: just test-component
      - name: Tests (integration)
        run: just test-integration
      - name: Install lcov
        run: sudo apt-get install -y lcov
        if: always()
      - name: Coverage report
        uses: zgosalvez/github-actions-report-lcov@84f16a83ae03e846a4c697bd75cae3f94fa9f426 # v7.0.12
        if: always()
        with:
          coverage-files: lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: CRAP
        run: just crap
      - name: Install drywall
        # Pinned to drywall's latest release; bump this tag alongside the SHA
        # pins on the GitHub Actions above when drywall cuts a new release.
        run: |
          gh release download v0.1.3 --repo gabadi/drywall --pattern 'drywall-linux-x86_64' --output drywall
          chmod +x drywall
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: DRY
        run: just dry
        env:
          DRYWALL: ./drywall
      - name: Mutation manifest
        run: just manifest
      - name: Install gherkin-parser
        # Pinned to a specific commit SHA, not a "stable release": upstream
        # has no tags (confirmed via `git ls-remote --tags
        # https://github.com/unclebob/Acceptance-Pipeline-Specification`
        # returning nothing), so there is no release tag to pin instead.
        # This pin governs only CI's build of gherkin-parser here — it does
        # not and cannot pin any separately, manually installed local
        # gherkin-parser binary (e.g. a developer's ~/.local/bin/gherkin-parser),
        # which has no manifest in this repo and stays an unmanaged,
        # out-of-scope concern.
        run: |
          git clone https://github.com/unclebob/Acceptance-Pipeline-Specification /tmp/aps
          cd /tmp/aps && git checkout accaa33d503340c56513ef387258f8da929ba902
          cd /tmp/aps && go build -o /usr/local/bin/gherkin-parser ./cmd/gherkin-parser
      - name: Acceptance tests
        run: just acceptance
