name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          version: "0.12.3"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      # Gate commands live in the justfile (one source of truth for CI + local
      # `just check`) — see justfile's header comment. Steps stay separate
      # (rather than one `just check` call) so the Actions UI keeps per-gate
      # timing and log folding.
      - name: Lint
        run: just lint
      - name: Format check
        run: just format-check
      # Coverage is measured on test-unit alone: it writes lcov.info and
      # applies the threshold, so the CRAP step below scores unit-only data.
      # test-component appends to .coverage without touching lcov.info, and
      # test-integration adds no coverage data at all (measured; see the
      # justfile). Both stay here as test gates in their own right. These steps share one working directory by necessity: test-unit
      # cannot move to a separate job from CRAP without merging coverage first.
      - name: Tests (unit)
        run: just test-unit
      - name: Tests (component)
        run: just test-component
      - name: Tests (integration)
        run: just test-integration
      - name: CRAP
        run: just crap
      - name: Install tools
        # Installs the pinned drywall and gherkin-parser through the justfile's
        # `install-tools` recipe, the same one a local run uses, so the pins
        # live in one place. Adds ~/.local/bin to PATH for the steps after it.
        run: |
          just install-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: DRY
        run: just dry
      - name: Mutation manifest
        run: just manifest
      - name: Acceptance tests
        run: just acceptance
