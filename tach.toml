# Package layering (issue #38, gate 02): the direction AGENTS.md's "Module
# Dependency Invariants" describes in prose, enforced mechanically by `tach
# check` (wired into the `lint` gate — see justfile). `layers` is ordered
# highest first; a module may import anything in a strictly lower layer for
# free, but importing a sibling in its own layer still needs an explicit
# `depends_on` entry — that's what makes the _coverage-must-not-import
# _discovery invariant hold without a separate rule: both sit in `domain`,
# neither lists the other, so tach rejects it the moment someone adds it.
#
# Layers, lowest first (mirrors AGENTS.md and issue 02's own ordering):
#   primitives          -> id derivation, glob dialect, command execution
#   domain              -> site discovery, manifest, coverage, test
#                          selection, workspace
#   execution_backends  -> parallel workers, fork server
#   run_loop            -> the run-loop orchestration module
#   cli_adapter         -> the CLI adapter
#
# Issue #38 (blocked by this ticket) extracts target/glob resolution out of
# __main__.py into its own module. It will depend on `domain` (workspace,
# glob dialect) and be depended on by `cli_adapter`, but nothing in
# `run_loop` or `execution_backends` needs it — so it gets its own layer
# directly above `domain`, e.g. `layers = [..., "run_loop",
# "target_resolution", "domain", "primitives"]`, without disturbing the
# rest of the order.
source_roots = ["src"]
layers = ["cli_adapter", "run_loop", "execution_backends", "domain", "primitives"]
forbid_circular_dependencies = true

[[modules]]
path = "mutate4py"
layer = "primitives"
depends_on = []

[[modules]]
path = "mutate4py._ids"
layer = "primitives"
depends_on = []

[[modules]]
path = "mutate4py._glob_dialect"
layer = "primitives"
depends_on = []

[[modules]]
path = "mutate4py._cmd"
layer = "primitives"
depends_on = []

[[modules]]
path = "mutate4py._discovery"
layer = "domain"
depends_on = []

[[modules]]
path = "mutate4py._manifest"
layer = "domain"
depends_on = []

[[modules]]
path = "mutate4py._coverage"
layer = "domain"
depends_on = []

[[modules]]
path = "mutate4py._test_selection"
layer = "domain"
depends_on = []

[[modules]]
path = "mutate4py._workspace"
layer = "domain"
depends_on = []

[[modules]]
path = "mutate4py._workers"
layer = "execution_backends"
depends_on = []

[[modules]]
path = "mutate4py._fork_server"
layer = "execution_backends"
depends_on = []

[[modules]]
path = "mutate4py._runner"
layer = "run_loop"
depends_on = []

[[modules]]
path = "mutate4py.__main__"
layer = "cli_adapter"
depends_on = []
