# Package layering, enforced by `tach check` (wired into the `lint` gate).
#
# `layers` is ordered highest first. A module may import anything in a strictly
# lower layer for free; importing a sibling in its own layer needs an explicit
# `depends_on`. That one mechanic is what enforces the "_coverage must not
# import _discovery" invariant — both sit in `domain`, neither lists the other,
# so tach rejects the import the moment someone adds it. It needs no rule of
# its own.
#
# Most layers here hold a single module extracted from `__main__.py` or
# `_runner.py` to keep those under their size caps. Their order relative to
# each other encodes only real dependencies — `site_selection` above `report`,
# `source_loading` above `manifest_storage`. The rest of that ordering carries
# no meaning; don't derive one from it.
#
# Two placements are load-bearing and easy to "tidy" wrongly:
#
# `_executor_selection` and `_test_dispatch` must stay at or below
# `execution_backends`. Both are reached from two directions — the orchestrator
# process (`run_loop`) and each parallel Worker's own subprocess
# (`_worker_server`, itself in `execution_backends`) — and `execution_backends`
# may never import `execution` or above. Only a layer at or below
# `execution_backends` is importable from both. Executor eligibility is a
# property of *this process's* import state, which is why it lives with the
# backends rather than in a layer above them.
#
# `_dispatch` is a second adapter-tier module, not a domain one (see its own
# docstring): it exits the process directly instead of raising. It belongs
# directly below `cli_adapter`, not alongside the single-module extractions
# above `domain`.
source_roots = ["src"]
layers = [
    "cli_adapter",
    "dispatch",
    "run_loop",
    "execution",
    "execution_backends",
    "cli_validation",
    "site_selection",
    "target_resolution",
    "report",
    "source_loading",
    "manifest_storage",
    "baseline",
    "domain",
    "primitives",
]
forbid_circular_dependencies = true

