# Package layering (issue #38, gate 02): the direction AGENTS.md's "Module
# Dependency Invariants" describes in prose, enforced mechanically by `tach
# check` (wired into the `lint` gate — see justfile). `layers` is ordered
# highest first; a module may import anything in a strictly lower layer for
# free, but importing a sibling in its own layer still needs an explicit
# `depends_on` entry — that's what makes the _coverage-must-not-import
# _discovery invariant hold without a separate rule: both sit in `domain`,
# neither lists the other, so tach rejects it the moment someone adds it.
#
# Layers, lowest first (mirrors AGENTS.md and issue 02's own ordering):
#   primitives          -> id derivation, glob dialect, command execution
#   domain              -> site discovery, manifest, coverage, test
#                          selection, workspace
#   execution_backends  -> parallel workers, fork server
#   run_loop            -> the run-loop orchestration module
#   cli_adapter         -> the CLI adapter
#
# Issue #38 gate 05 extracted target/glob resolution out of __main__.py into
# `_target_resolution`. It depends on `domain` (glob dialect) and is
# depended on by `cli_adapter`; nothing in `run_loop` or
# `execution_backends` needs it, so it sits in its own layer directly above
# `domain`.
#
# Issue #38 gate 08 extracted the run loop's line-returning report/format
# functions out of `_runner.py` into `_report`. It depends only on `domain`
# (Site, discovery, coverage) and is depended on by `run_loop`; nothing in
# `execution_backends` or `target_resolution` needs it, so it sits in its
# own layer directly above `domain`, alongside `target_resolution`.
#
# Issue #38 gate 09 extracted the mutant build/run/tally cluster out of
# `_runner.py` into `_execution`. It needs both `_report` (per-mutant
# progress-line formatting) and `_workers` (the parallel dispatch it
# routes to), so it sits directly above `execution_backends` — one layer
# below `run_loop`, which is its only caller.
#
# Issue #38 gate 10 extracted the two manifest-storage adapters (sidecar
# JSON vs. embedded footer) out of `_runner.py` into `_manifest_storage`.
# It depends only on `_manifest` (domain layer) and is depended on by
# `run_loop`; nothing in `execution`, `execution_backends`, or
# `target_resolution` needs it, so it sits in its own layer directly
# above `domain`, alongside `target_resolution` and `report`.
source_roots = ["src"]
layers = [
    "cli_adapter",
    "run_loop",
    "execution",
    "execution_backends",
    "target_resolution",
    "report",
    "manifest_storage",
    "domain",
    "primitives",
]
forbid_circular_dependencies = true

[[modules]]
path = "mutate4py"
layer = "primitives"
depends_on = []

