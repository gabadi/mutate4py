[project]
name = "mutate4py"
version = "0.1.2"
description = "Mutation testing for Python with an embedded-in-source manifest"
readme = "README.md"
license = "MIT"
keywords = ["mutation", "testing", "coverage", "quality", "mutate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mutate4py = "mutate4py.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutate4py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --strict-markers"
markers = [
    "integration: spawns a real subprocess (fresh Python interpreter) via _run_cli_path/_run_cli_in; excluded from the mutation test command, run only by the full `test` gate.",
]

[tool.coverage.run]
source = ["mutate4py"]
branch = true

[tool.uv.sources]
crap4py = { git = "https://github.com/gabadi/crap4py", rev = "v0.1.1" }

[dependency-groups]
dev = [
    "bump-my-version>=0.32.0",
    "crap4py",
    "hypothesis>=6.135.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
    "tach>=0.35.0",
]

[tool.bumpversion]
current_version = "0.1.2"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.ruff]
# Read by both the linter (E501) and `ruff format`'s wrap width, so the two
# can never disagree.
line-length = 120

[tool.ruff.lint]
# Needed only because too-many-locals (PLR0914) and too-many-positional-
# arguments (PLR0917) are preview-gated in ruff 0.15. Scoped to [lint] only
# (not top-level [tool.ruff]) so it doesn't also flip `ruff format` into its
# preview hug-brackets style. IMPORTANT: use `select` below, not
# `extend-select` — with preview on, `extend-select` was observed to extend
# from ruff's full (~900-rule) preview set instead of the E4/E7/E9/F default,
# silently enabling dozens of unrelated rule families. `select` does not
# have this problem.
preview = true

# The current defaults (E4/E7/E9/F), spelled out because `select` replaces
# rather than adds to them, plus the shape rules below.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "E501",     # line-too-long
    "FBT",      # boolean-trap family (FBT001/002/003)
    "PLR0913",  # too-many-arguments
    "PLR0914",  # too-many-locals
    "PLR0917",  # too-many-positional-arguments
    "T20",      # print family (T201/T203)
]
# mccabe complexity (C901), too-many-branches (PLR0912), and too-many-
# statements (PLR0915) are deliberately NOT selected: measured against this
# source at ruff's own default thresholds (max-complexity=10, max-
# branches=12, max-statements=50), all three report zero findings. The
# per-function CRAP gate (`just check crap`) already keeps every function
# small, so these would add configuration surface with no signal. Don't
# re-add them on principle — re-measure first.

[tool.ruff.lint.pylint]
# Deliberate, not left at ruff's default (which happens to match): measured
# against this source, non-flagged functions cluster at <=5 arguments; the
# run-loop entry points that needed argument-bundling started at 6+ (up to
# 18, before the RunMutationsRequest/MutantExecCtx refactor). 5 is the
# natural boundary, not an arbitrary pylint number.
max-args = 5
max-positional-args = 5
# Default (15); the one violation (run_mutations, 25 locals) was fixed by
# splitting it into _prepare_run_setup/_select_and_prepare, not by loosening
# this threshold.
max-locals = 15

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["FBT003"]  # idiomatic pytest-style positional bools at call sites, not an API smell
# print is this CLI's actual output mechanism, not debug leakage:
"src/mutate4py/__main__.py" = ["T201"]  # the CLI adapter's job
"src/mutate4py/_runner.py" = ["T201"]  # render/print seam factored out by ticket 06
"src/mutate4py/_workspace.py" = ["T201"]  # print-then-exit replaced by a typed error per ticket 05
