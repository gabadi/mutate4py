[project]
name = "mutate4py"
version = "0.0.0"
description = "Mutation testing for Python with an embedded-in-source manifest"
readme = "README.md"
license = "MIT"
keywords = ["mutation", "testing", "coverage", "quality", "mutate"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mutate4py = "mutate4py.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutate4py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["mutate4py"]
branch = true

[tool.mutmut]
source_paths = ["src/"]
mutate_only_covered_lines = true

[dependency-groups]
dev = [
    "mutmut>=3.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
]
