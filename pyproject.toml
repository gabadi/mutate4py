[project]
name = "mutate4py"
version = "0.1.3"
description = "Mutation testing for Python with an embedded-in-source manifest"
readme = "README.md"
license = "MIT"
keywords = ["mutation", "testing", "coverage", "quality", "mutate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mutate4py = "mutate4py.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutate4py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "--tb=short --strict-markers --ignore=tests/fixtures/django_project --ignore=tests/fixtures/overlapping_coverage"
markers = [
    "unit: fast, fully isolated test; no real subprocess/fork execution. Runs in the test-unit gate, which is also where the coverage measurement is taken.",
    "component: exercises mutate4py's own pipeline in-process (real subprocess/fork spawns via an Executor), so it is slow -- but it still runs in this interpreter, so --cov-context=test sees it and it stays eligible for per-Mutant test narrowing. Excluded from test-unit's fast gate and, with it, from the coverage measurement; runs in test-component.",
    "integration: work runs inside a spawned interpreter (via _run_cli_path/_run_cli_in), so --cov-context=test can't see it and it contributes no per-Mutant test narrowing; excluded from the mutation test command, and coverage-blind, so it is outside the coverage measurement too. Runs in test-integration.",
]

[tool.coverage.run]
source = ["mutate4py"]
branch = true

[dependency-groups]
dev = [
    "bump-my-version==1.5.1",
    "crap4py==0.1.1",
    "django==5.2.17",
    "hypothesis==6.165.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.13.0",
    "ruff==0.16.2",
    "tach==0.35.0",
]

[tool.bumpversion]
current_version = "0.1.3"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.ruff]
# Read by both the linter (E501) and `ruff format`'s wrap width, so the two
# can never disagree.
line-length = 120

[tool.ruff.lint]
# Carried only for too-many-locals (PLR0914), still preview-gated at the pinned
# ruff. Scoped to [lint] rather than top-level [tool.ruff] so it doesn't also
# flip `ruff format` into its preview hug-brackets style. Drop it once PLR0914
# stabilises — re-check with `ruff rule PLR0914`, don't assume.
#
# Keep `select` below, never `extend-select`: with preview on, `extend-select`
# was observed to extend from ruff's full (~900-rule) preview set rather than
# the E4/E7/E9/F default, silently enabling dozens of unrelated rule families.
preview = true

# The default rules (E4/E7/E9/F) are respelled here because `select` replaces
# them rather than adding to them.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "E501",     # line-too-long
    "FBT",      # boolean-trap family (FBT001/002/003)
    "PLR0913",  # too-many-arguments
    "PLR0914",  # too-many-locals
    "PLR0917",  # too-many-positional-arguments
    "T20",      # print family (T201/T203)
]
# mccabe complexity (C901), too-many-branches (PLR0912), and too-many-
# statements (PLR0915) are deliberately NOT selected: measured against this
# source at ruff's own default thresholds (max-complexity=10, max-
# branches=12, max-statements=50), all three report zero findings. The
# per-function CRAP gate (`just check crap`) already keeps every function
# small, so these would add configuration surface with no signal. Don't
# re-add them on principle — re-measure first.

[tool.ruff.lint.pylint]
# Deliberate, not left at ruff's default (which happens to match): measured
# against this source, non-flagged functions cluster at <=5 arguments; the
# run-loop entry points that needed argument-bundling started at 6+ (up to
# 18, before the RunMutationsRequest/MutantExecCtx refactor). 5 is the
# natural boundary, not an arbitrary pylint number.
max-args = 5
max-positional-args = 5
# Default (15); the one violation (run_mutations, 25 locals) was fixed by
# splitting it into _prepare_run_setup/_select_and_prepare, not by loosening
# this threshold.
max-locals = 15

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["FBT003"]  # idiomatic pytest-style positional bools at call sites, not an API smell
