[project]
name = "mutate4py"
version = "0.1.2"
description = "Mutation testing for Python with an embedded-in-source manifest"
readme = "README.md"
license = "MIT"
keywords = ["mutation", "testing", "coverage", "quality", "mutate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mutate4py = "mutate4py.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutate4py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --strict-markers"
markers = [
    "integration: spawns a real subprocess (fresh Python interpreter) via _run_cli_path/_run_cli_in; excluded from the mutation test command, run only by the full `test` gate.",
]

[tool.coverage.run]
source = ["mutate4py"]
branch = true

[tool.uv.sources]
crap4py = { git = "https://github.com/gabadi/crap4py", rev = "v0.1.1" }

[dependency-groups]
dev = [
    "bump-my-version>=0.32.0",
    "crap4py",
    "hypothesis>=6.135.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
    "tach>=0.35.0",
]

[tool.bumpversion]
current_version = "0.1.2"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
